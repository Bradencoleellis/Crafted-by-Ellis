<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Crafted by Ellis">
  <!-- The studio mark: lowercase e and a full stop, outlined from Archivo at
       wght 600 / wdth 112 — the same instance the site's display type uses.

       Outlines, not <text>: favicons render in a restricted context that does
       not fetch webfonts, so the previous version's Google Fonts @import never
       loaded and the mark fell back to whatever serif was to hand.

       All ink, no accent. The studio shell carries no brand colour in this
       system — colour belongs to the apps — so the old rust dot is gone. The
       square full stop is Archivo's own. -->
